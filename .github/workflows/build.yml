name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
      prerelease:
        type: boolean
        default: false
        
jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: baax }
          - { name: linux-aarch64, os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, binary: baax }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: baax.exe, vcpkg_triplet: x64-windows-static-md }
          - { name: windows-aarch64, os: windows-11-vs2026-arm, target: aarch64-pc-windows-msvc, binary: baax.exe, vcpkg_triplet: arm64-windows-static-md }
          - { name: macos-x86_64, os: macos-26-intel, target: x86_64-apple-darwin, binary: baax }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, binary: baax }
          
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install static OpenSSL (Windows)
        if: startsWith(matrix.config.os, 'windows')
        shell: pwsh
        run: |
          vcpkg install openssl:${{ matrix.config.vcpkg_triplet }}
          $installDir = "$env:VCPKG_INSTALLATION_ROOT\installed\${{ matrix.config.vcpkg_triplet }}"
          echo "OPENSSL_DIR=$installDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$installDir\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$installDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Remove system OpenSSL from PATH (Windows)
        if: startsWith(matrix.config.os, 'windows')
        shell: pwsh
        run: |
          $newPath = ($env:PATH -split ';' | Where-Object { $_ -notlike '*OpenSSL*' }) -join ';'
          echo "PATH=$newPath" >> $env:GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.config.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.config.target }}

      - name: Zip
        uses: vimtor/action-zip@v1.3
        with:
          files: target/${{ matrix.config.target }}/release/${{ matrix.config.binary }}
          dest: baax-${{ matrix.config.name }}.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: baax-${{ matrix.config.name }}
          path: baax-${{ matrix.config.name }}.zip

  deploy:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''

    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout
        if: inputs.tag != ''
        uses: actions/checkout@v7
    
      - name: Create tag
        if: inputs.tag != ''
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}
    
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
    
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}