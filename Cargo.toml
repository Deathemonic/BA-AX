[package]
name = "baax"
version = "1.0.0"
edition = "2024"

[lib]
name = "baax"
path = "src/lib.rs"

[[bin]]
name = "baax"
path = "src/main.rs"

[dependencies]
eyre = "0.6.12"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
memmap2 = "0.9.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rand_mt = "6.0.3"
zip = "8.6.0"
base64 = "0.22.1"

bacy = { git = "https://github.com/Deathemonic/BA-CY", version = "3.2.0" }
baad-core = { git = "https://github.com/RZinth/BA-AD-Core", version = "2.7.1" }
